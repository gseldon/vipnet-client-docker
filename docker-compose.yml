# Ротация логов docker
x-log: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "10"

services:
  vpn:
    <<: *logging
    image: gseldon/vipnetclient:latest
    container_name: vipnet
    # ViPNet не запускается без privileged (проверено: с одним NET_ADMIN
    # vipnetclient падает с "Operation not permitted")
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ./.env
    tmpfs:
      - /run
      - /tmp
    restart: unless-stopped
    security_opt:
      - label:disable
    volumes:
      - ./app/key.dst:/vipnet/key.dst:ro
    # healthcheck берётся из образа (/healthcheck.sh, использует HEALTHCHECK_CMD)
